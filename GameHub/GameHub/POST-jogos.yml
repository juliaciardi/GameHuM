info:
  name: POST-jogos
  type: http

http:
  method: POST
  url: http://localhost:3000/jogos
  body:
    type: json
    data: |-
      {
        "titulo": "Super Mario Odyssey",
        "ano_lancamento": 2017,
        "estudio_id": 2
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
