info:
  name: POST-estudios
  type: http

http:
  method: POST
  url: http://localhost:3000/estudios
  body:
    type: json
    data: |-
      {
        "nome": "Nintendo",
        "pais": "Japão"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
